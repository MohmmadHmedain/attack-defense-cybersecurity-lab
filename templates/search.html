<!DOCTYPE html>
<html>
<head>
    <title>User Search</title>
</head>
<body>

<h1>User Search</h1>

<form method="GET">
    <!-- User input is escaped by Jinja to prevent reflected XSS -->
    <input type="text" name="q" value="{{ query }}" placeholder="Search username">
    <button type="submit">Search</button>
</form>

{% if results %}
<h2>Results</h2>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Email</th>
    </tr>

    {% for user in results %}
    <tr>
        <td>{{ user[0] }}</td>
        <td>{{ user[1] }}</td>
        <td>{{ user[2] }}</td>
    </tr>
    {% endfor %}
</table>
{% endif %}

<p><a href="/">Back to Home</a></p>

</body>
</html>
